<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Переодень героя: промпты</title>
<style>
  :root {
    --bg: #f8f4e9;
    --ink: #1c1b19;
    --muted: #6b665c;
    --card: #ffffff;
    --line: #e4ddcc;
    --pin: #d6262c;
    --btn-bg: #1c1b19;
    --btn-ink: #f8f4e9;
    --field: #faf7ee;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1814;
      --ink: #f3eee2;
      --muted: #a39d8f;
      --card: #26231e;
      --line: #3a362f;
      --btn-bg: #f3eee2;
      --btn-ink: #1a1814;
      --field: #1f1c18;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1814;
    --ink: #f3eee2;
    --muted: #a39d8f;
    --card: #26231e;
    --line: #3a362f;
    --btn-bg: #f3eee2;
    --btn-ink: #1a1814;
    --field: #1f1c18;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 18px 56px; }

  h1 {
    margin: 0;
    font-weight: 900;
    font-size: clamp(34px, 9vw, 64px);
    line-height: 0.98;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .bubble {
    position: relative;
    display: inline-block;
    margin: 20px 0 6px;
    padding: 12px 20px;
    background: var(--card);
    border-radius: 999px;
    font-weight: 500;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 38px; bottom: -9px;
    border: 9px solid transparent;
    border-top-color: var(--card);
    border-bottom: 0;
  }

  .tabs {
    display: flex; gap: 8px; margin: 30px 0 22px;
    overflow-x: auto; padding-bottom: 4px;
  }
  .tab {
    flex: 0 0 auto;
    font: inherit; font-weight: 700;
    padding: 11px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent; color: var(--ink);
    cursor: pointer;
    min-height: 44px;
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  .tab:focus-visible, .copy:focus-visible, input:focus-visible {
    outline: 3px solid var(--pin); outline-offset: 2px;
  }

  h2 { margin: 0 0 4px; font-size: 24px; font-weight: 900; letter-spacing: -0.01em; }
  .lead { margin: 0 0 18px; color: var(--muted); }

  .slots { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 26px; }
  @media (min-width: 560px) { .slots.two { grid-template-columns: 1fr 1fr; } }
  .slot {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 16px 14px 56px;
  }
  .pin {
    position: absolute; left: 16px; top: 16px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--pin); color: #fff;
    font-weight: 900; font-size: 15px;
    display: grid; place-items: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .slot b { display: block; font-size: 17px; }
  .slot span { color: var(--muted); font-size: 15px; }

  .prompts { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .prompts { grid-template-columns: 1fr 1fr; } }
  .prompt {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .prompt h3 { margin: 0; font-size: 17px; font-weight: 900; }
  .prompt .hint { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .field input {
    width: 100%; font: inherit; font-size: 16px;
    padding: 10px 12px;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--field); color: var(--ink);
  }
  .text {
    margin: 0;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px; line-height: 1.55;
    white-space: pre-wrap; word-wrap: break-word;
    flex: 1;
  }
  .copy {
    font: inherit; font-weight: 700;
    min-height: 48px;
    border: 0; border-radius: 12px;
    background: var(--btn-bg); color: var(--btn-ink);
    cursor: pointer;
  }
  .copy.done { background: var(--pin); color: #fff; }

  .note { margin: 26px 0 0; color: var(--muted); font-size: 15px; }
  @media (prefers-reduced-motion: no-preference) {
    .copy { transition: background .15s ease; }
  }

  .example { margin: 0 0 26px; }
  .example img {
    display: block; width: 100%; height: auto;
    border-radius: 14px; border: 1px solid var(--line);
  }
  .example figcaption { margin-top: 8px; color: var(--muted); font-size: 14px; }
  .help {
    margin-top: 30px; padding: 18px 18px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  }
  .help h3 { margin: 0 0 8px; font-size: 18px; font-weight: 900; }
  .help ul { margin: 0; padding-left: 20px; }
  .help li { margin: 6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Переодень героя</h1>
  <div class="bubble">Фото 1 — кого, фото 2 — во что</div>

  <div class="tabs" role="tablist" aria-label="Тип промпта">
    <button class="tab" role="tab" data-id="character" aria-selected="true">Персонаж</button>
    <button class="tab" role="tab" data-id="person" aria-selected="false">Человек</button>
    <button class="tab" role="tab" data-id="look" aria-selected="false">Лук словами</button>
  </div>

  <section id="view" aria-live="polite"></section>

  <div class="help">
    <h3>Не получилось?</h3>
    <ul>
      <li>Не правь промпт, запускай заново целиком.</li>
      <li>Проверь порядок: фото 1 — кого переодеваем, фото 2 — лук.</li>
      <li>Упрости лук: два-три предмета вместо целого образа.</li>
      <li>Нейронка не поняла английский? Возьми русскую версию.</li>
    </ul>
  </div>
</div>

<script>
  var DATA = {
    character: {
      title: "Переодеть персонажа",
      lead: "Кот, герой, маскот. Персонаж остаётся прежним, меняется только одежда.",
      slots: [
        { n: 1, t: "Персонаж", d: "Картинка героя, которого переодеваем. Загружай её первой." },
        { n: 2, t: "Лук", d: "Фото одежды, коллаж или пин из Pinterest. Загружай вторым." }
      ],
      en: "Use the first attached image as the character and the second attached image as the outfit reference. Keep the character from the first image exactly the same: the same face, eyes, colors, proportions and pose. Dress the character in the complete outfit from the second image, copying each clothing item, its colors, patterns and materials, and fit it naturally to the character's body. Remove the character's original clothes. Show the full body on a plain light background. No text, letters or logos.",
      ru: "Первое приложенное изображение — персонаж, второе — референс одежды. Оставь персонажа с первого изображения без изменений: то же лицо, глаза, цвета, пропорции и поза. Одень персонажа в полный образ со второго изображения, повторив каждую вещь, её цвет, принт и материал, и посади одежду по фигуре персонажа естественно. Убери исходную одежду персонажа. Покажи персонажа в полный рост на однотонном светлом фоне. Без текста, букв и логотипов."
    },
    person: {
      title: "Переодеть человека",
      lead: "Лицо, волосы и поза остаются как на фото, меняется только одежда.",
      slots: [
        { n: 1, t: "Человек", d: "Фото человека, которого переодеваем. Загружай его первым." },
        { n: 2, t: "Лук", d: "Фото одежды, коллаж или пин из Pinterest. Загружай вторым." }
      ],
      en: "Use the first attached image as the person and the second attached image as the outfit reference. Keep the person from the first image exactly the same: the same face, facial features, hair, skin tone, body proportions and pose. Dress the person in the complete outfit from the second image, copying each clothing item, its colors, patterns and materials, and fit it naturally to their body. Replace the original clothes completely. Realistic photo, soft natural light, the same background as in the first image. No text, letters or logos.",
      ru: "Первое приложенное изображение — человек, второе — референс одежды. Оставь человека с первого изображения без изменений: то же лицо, черты, волосы, тон кожи, пропорции тела и поза. Одень человека в полный образ со второго изображения, повторив каждую вещь, её цвет, принт и материал, и посади одежду по фигуре естественно. Полностью замени исходную одежду. Реалистичное фото, мягкий естественный свет, тот же фон, что на первом изображении. Без текста, букв и логотипов."
    },
    look: {
      title: "Лук по описанию",
      lead: "Второе фото не нужно: одежду описываешь словами в поле над промптом.",
      slots: [
        { n: 1, t: "Персонаж или человек", d: "Одна картинка, кого переодеваем. Больше ничего не загружай." }
      ],
      fieldEn: { label: "Лук по-английски", value: "black wool beret, navy and white striped shirt, round tortoiseshell sunglasses" },
      fieldRu: { label: "Лук по-русски", value: "чёрный шерстяной берет, тельняшка в тёмно-синюю полоску, круглые очки в черепаховой оправе" },
      en: "Use the attached image as the subject and keep it exactly the same: the same face, features, colors, proportions and pose. Dress the subject in this outfit: ({look}). Replace the original clothes completely and fit the outfit naturally to the body. Plain light background, full body visible. No text, letters or logos.",
      ru: "Приложенное изображение — объект съёмки. Оставь его без изменений: то же лицо, черты, цвета, пропорции и поза. Одень его в этот образ: ({look}). Полностью замени исходную одежду и посади образ по фигуре естественно. Однотонный светлый фон, виден полный рост. Без текста, букв и логотипов."
    }
  };

  var view = document.getElementById("view");
  var tabs = document.querySelectorAll(".tab");
  var current = "character";
  var looks = { en: DATA.look.fieldEn.value, ru: DATA.look.fieldRu.value };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function copyText(text, btn) {
    function ok() {
      btn.textContent = "Скопировано";
      btn.classList.add("done");
      setTimeout(function () { btn.textContent = "Скопировать"; btn.classList.remove("done"); }, 1600);
    }
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        ok();
      } catch (e) {
        btn.textContent = "Выдели текст и скопируй вручную";
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, fallback);
      } else { fallback(); }
    } catch (e) { fallback(); }
  }

  function promptCard(lang, d, isLook) {
    var card = el("div", "prompt");
    card.appendChild(el("h3", "", lang === "en" ? "English" : "Русский"));
    var body = el("pre", "text");
    function build() {
      var tpl = d[lang];
      return isLook ? tpl.replace("{look}", looks[lang]) : tpl;
    }
    if (isLook) {
      var f = d[lang === "en" ? "fieldEn" : "fieldRu"];
      var wrap = el("div", "field");
      var id = "look-" + lang;
      var lab = el("label", "", f.label);
      lab.setAttribute("for", id);
      var inp = document.createElement("input");
      inp.type = "text"; inp.id = id; inp.value = looks[lang];
      inp.addEventListener("input", function () {
        looks[lang] = inp.value;
        body.textContent = build();
      });
      wrap.appendChild(lab); wrap.appendChild(inp);
      card.appendChild(wrap);
    }
    body.textContent = build();
    card.appendChild(body);
    var btn = el("button", "copy", "Скопировать");
    btn.type = "button";
    btn.addEventListener("click", function () { copyText(body.textContent, btn); });
    card.appendChild(btn);
    return card;
  }

  function render(id) {
    current = id;
    var d = DATA[id];
    view.textContent = "";
    view.appendChild(el("h2", "", d.title));
    view.appendChild(el("p", "lead", d.lead));
